<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>挽臉工作室預約</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f7f4ef;
      color: #333;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 30px 22px;
      text-align: center;

      box-shadow:
        0 4px 18px rgba(0,0,0,0.07);
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
    }

    .message {
      margin-top: 20px;
      color: #666;
      line-height: 1.7;
    }

    .error {
      color: #a33;
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 26px auto;

      border: 4px solid #eee;
      border-top-color: #5e9477;
      border-radius: 50%;

      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>挽臉工作室預約</h1>

    <div class="spinner"></div>

    <div
      id="message"
      class="message"
    >
      正在連接 LINE...
    </div>

  </div>

</div>

<script>

  const LIFF_ID =
    '2011548542-hgz3StN4';


  /*
   * ↓↓↓ 這裡請放你完整的 Apps Script /exec 網址 ↓↓↓
   */
  const BOOKING_URL =
    '你的完整AppsScript網址';


  async function start() {

    const message =
      document.getElementById('message');


    try {

      message.textContent =
        '正在初始化 LINE...';


      await liff.init({
        liffId: LIFF_ID
      });


      if (!liff.isLoggedIn()) {

        message.textContent =
          '正在登入 LINE...';

        liff.login();

        return;
      }


      message.textContent =
        'LINE 登入成功，正在取得身分...';


      const idToken =
        liff.getIDToken();


      const decoded =
        liff.getDecodedIDToken();


      if (!idToken) {

        throw new Error(
          '無法取得 LINE ID Token'
        );
      }


      if (!decoded) {

        throw new Error(
          '無法取得 LINE 使用者資料'
        );
      }


      message.textContent =
        '登入成功：' +
        (decoded.name || 'LINE 使用者') +
        '，正在前往預約頁...';


      /*
       * 用 POST 把 Token 傳給 Apps Script
       * 不再使用網址 #id_token
       */

      const form =
        document.createElement('form');

      form.method =
        'POST';

      form.action =
        BOOKING_URL;


      const tokenInput =
        document.createElement('input');

      tokenInput.type =
        'hidden';

      tokenInput.name =
        'id_token';

      tokenInput.value =
        idToken;


      form.appendChild(
        tokenInput
      );


      document.body.appendChild(
        form
      );


      form.submit();

    }

    catch (error) {

      console.error(error);

      message.classList.add(
        'error'
      );

      message.textContent =
        'LINE 登入失敗：' +
        (
          error.message ||
          String(error)
        );
    }

  }


  start();

</script>

</body>
</html>
